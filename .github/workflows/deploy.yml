name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck + lint + i18n + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: i18n parity check
        run: npm run check:i18n

      - name: Unit tests
        run: npm test
        env:
          NEXT_PUBLIC_API_URL: https://api.dunas-travel.com/api
          INTERNAL_API_URL: https://api.dunas-travel.com/api
          NEXT_PUBLIC_FRONTEND_URL: https://dunas-travel.com

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.dunas-travel.com/api
          INTERNAL_API_URL: https://api.dunas-travel.com/api
          NEXT_PUBLIC_FRONTEND_URL: https://dunas-travel.com
