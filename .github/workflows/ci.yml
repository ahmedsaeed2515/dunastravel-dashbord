name: Dashboard CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint codebase
        run: npm run lint

      - name: Run unit & component tests
        run: npm run test

      - name: Check i18n keys
        run: npm run check:i18n

      - name: Build Next.js application
        env:
          NEXT_PUBLIC_API_URL: "https://api.dunastravel.com/api"
        run: npm run build
